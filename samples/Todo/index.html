<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tâches</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <header>
        <h1 id="titre">Tâches</h1>
        <p class="version" id="version"></p>
    </header>

    <p class="intro">
        Une application de démonstration pour Proton. Les tâches sont enregistrées
        dans une base SQLite locale, et les pièces jointes sont de vrais fichiers
        posés sur le disque.
    </p>

    <div id="contenu">
        <form id="formulaire">
            <input type="text" id="note" placeholder="Que faut-il faire ?" autocomplete="off" required>
            <button type="submit" class="bouton">Ajouter</button>
        </form>

        <ul id="taches"></ul>
    </div>
</main>

<script src="js/proton.js"></script>
<script src="js/app.js"></script>
</body>
</html>
